{% extends "base.html" %}{% block content %}<h1>Add a subject</h1><p class="muted">Create a new subject-specific workspace.</p><form method="post" class="card form-card"><div class="form-grid"><div><label>Subject name *</label><input name="name" required></div><div><label>Course code *</label><input name="code" required></div><div><label>Department</label><input name="department" value="General"></div><div><label>Semester</label><input name="semester" value="Semester 1"></div><div class="full"><label>Course outcomes</label><textarea name="outcomes"></textarea></div><div class="full"><label>Units (separate with semicolons)</label><textarea name="syllabus_text" placeholder="Enter the syllabus manually, unit by unit"></textarea></div><div class="full"><label>Course calendar</label><textarea name="calendar"></textarea></div><div class="full"><label>Learning resources</label><textarea name="resources"></textarea></div><div class="full"><label>Website overview</label><textarea name="website_overview"></textarea></div></div><button class="primary">Create subject</button></form>{% endblock %}
