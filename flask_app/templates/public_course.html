<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ s.name }} — Course Page</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="public-page"><main class="public-course"><p class="eyebrow">COURSE WEBSITE</p><h1>{{ s.name }} <span class="code">{{ s.code }}</span></h1><p>{{ s.department }} · {{ s.semester }}</p><section class="card"><h2>Overview</h2><p>{{ s.website_overview }}</p></section><section class="card"><h2>Course Outcomes</h2><pre>{{ s.outcomes }}</pre></section><section class="card"><h2>Syllabus Units</h2><pre>{{ s.units }}</pre></section><section class="card"><h2>Weekly Schedule</h2><pre>{{ s.calendar }}</pre></section><section class="card"><h2>Learning Resources</h2><pre>{{ s.resources }}</pre></section><section class="card"><h2>Announcements</h2><p>{{ s.announcements }}</p></section></main></body></html>
